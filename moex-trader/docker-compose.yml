services:
  postgres:
    image: postgres:15-alpine
    container_name: moex_trading_db
    environment:
      POSTGRES_DB: ${PGDATABASE:-moex_trading}
      POSTGRES_USER: ${PGUSER:-trader}
      POSTGRES_PASSWORD: ${PGPASSWORD:-}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d moex_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
